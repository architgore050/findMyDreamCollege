name: findmydreamcollege

# Everything is overridable from a `.env` file, but none is required:
#   cp .env.example .env    # optional; defaults below match .env.example
# Credentials here are local-development defaults, not secrets. Never commit .env.
#
# Models are never baked into an image and never live in a named volume. The
# host directory ${MODEL_DIR:-/home/archit-gore/models} holds every weight set;
# containers that need weights mount it read-only at /models. Serving (vLLM for
# text and vision, the OCR adapter) is a host process, so a container rebuild can
# never trigger a re-download.
#
# On Linux `host.docker.internal` does not exist unless a service declares it;
# every container that calls the host vLLM (port 8000/8001) therefore carries
# `extra_hosts: ["host.docker.internal:host-gateway"]`. The URL itself has one
# name: FMD_LOCAL_LLM_URL (router) / FMD_OCR_VLLM_URL (OCR adapter).
#
# Network wiring (wave v1-w1, 2026-11-21): every service attaches to one
# declared network whose *physical* name is fixed to `fmd-net`, independent of
# the compose project name. Compose DNS resolves service names only among
# containers attached to the same network, so a service started under a
# different project (a stray `-p`, an older checkout, `docker compose up db`
# from a second clone) used to leave `api` looping
# "Temporary failure in name resolution" for `db`. A fixed-name declared
# network converges all invocations of this file onto one segment; the
# service-name aliases (`db`, `api`, `web`) follow the containers, so any
# `docker compose -f infra/docker-compose.yml ...` invocation finds the same db.
# `scripts/acceptance.sh` (`compose/smoke`) and
# `packages/pipeline/tests/test_compose_wiring.py` pin this wiring.

networks:
  fmd-net:
    name: fmd-net # fixed physical name; survives split/odd-project invocations
    driver: bridge

services:
  db:
    image: pgvector/pgvector:pg17
    networks: [fmd-net]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fmd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmd}
      POSTGRES_DB: ${POSTGRES_DB:-fmd}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fmd} -d ${POSTGRES_DB:-fmd}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Optional meta-search for discovery. Never evidence; leads only.
  searxng:
    image: searxng/searxng:latest
    profiles: ["discovery"]
    networks: [fmd-net]
    ports: ["${SEARXNG_PORT:-8888}:8080"]
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-8888}/
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped

  # OCR stage (T2). Not a model-router profile: acquisition calls it over HTTP at
  # $FMD_T2_URL/extract and gets block-level boxes back. This container is the
  # thin adapter; the vision weights are served by vLLM on the host
  # (`scripts/serve_ocr.sh vision-start`, port 8001) because that is where the
  # sm_120 (Blackwell) kernels are. Behind a profile so `make up` never starts it,
  # and the tier degrades to TierUnavailable + human queue when it is down.
  ocr:
    profiles: ["ocr"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.ocr
      args:
        OCR_REQUIREMENTS: requirements-vision.txt
        VCS_REF: ${VCS_REF:-unknown}
    image: findmydreamcollege/ocr:${FMD_IMAGE_TAG:-local}
    networks: [fmd-net]
    environment:
      FMD_OCR_CONFIG: /config/acquire.yaml
      FMD_OCR_TIER: ${FMD_OCR_TIER:-T2}
      # Empty means "use backends.T2.service from config/acquire.yaml".
      FMD_OCR_BACKEND: ${FMD_OCR_BACKEND:-}
      # The vLLM vision process runs on the host; reach it by name, not by IP.
      FMD_OCR_VLLM_URL: ${FMD_OCR_VLLM_URL:-http://host.docker.internal:8001/v1}
      # Weights are host data, mounted read-only. This container is a client of
      # vLLM, not a loader, so it never copies or downloads a model.
      FMD_MODEL_DIR: /models
      FMD_OCR_DPI: ${FMD_OCR_DPI:-200}
      FMD_OCR_MAX_PAGES: ${FMD_OCR_MAX_PAGES:-40}
      FMD_OCR_MAX_SIDE_PX: ${FMD_OCR_MAX_SIDE_PX:-2400}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${FMD_T2_PORT:-8110}:8110"]
    volumes:
      - ../config:/config:ro
      - ${MODEL_DIR:-/home/archit-gore/models}:/models:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=5)); sys.exit(0 if d.get('status')=='ok' else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # T2b: PaddleOCR-VL, the alternative engine. GPU wheels stop at sm_90, so this
  # runs on CPU on an sm_120 host: correct, slow, and never faked. Port 8111,
  # FMD_T2B_URL. Enable only when you actually need the second opinion.
  ocr-paddle:
    profiles: ["ocr-paddle"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.ocr
      args:
        OCR_BASE_IMAGE: nvidia/cuda:12.9.1-cudnn-runtime-ubuntu24.04
        OCR_REQUIREMENTS: requirements.txt
        OCR_APT_PACKAGES: libgl1 libglib2.0-0 libgomp1
        OCR_NEEDS_VENV_PACKAGES: "1"
        VCS_REF: ${VCS_REF:-unknown}
    image: findmydreamcollege/ocr-paddle:${FMD_IMAGE_TAG:-local}
    networks: [fmd-net]
    environment:
      FMD_OCR_CONFIG: /config/acquire.yaml
      FMD_OCR_TIER: T2b
      FMD_OCR_DEVICE: cpu
      FMD_OCR_DPI: ${FMD_OCR_DPI:-200}
      FMD_OCR_MAX_PAGES: ${FMD_OCR_MAX_PAGES:-40}
      # Weights live on the host, not in a docker volume: a rebuild or a volume
      # prune must never re-download 2 GB. Paddle caches its weights here.
      FMD_MODEL_DIR: /models
      PADDLE_PDX_CACHE_HOME: /models/paddlex
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["${FMD_T2B_PORT:-8111}:8110"]
    volumes:
      - ../config:/config:ro
      - ${MODEL_DIR:-/home/archit-gore/models}:/models:ro
      # Paddle writes a cache on first start; only this subdirectory is writable.
      - ${MODEL_DIR:-/home/archit-gore/models}/paddlex:/models/paddlex
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8110/health', timeout=5)); sys.exit(0 if d.get('status')=='ok' else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.pipeline
      # BuildKit's default bridge has no resolvable DNS on this host (2026-11-16:
      # download.pytorch.org -> "dns error"), which aborts the torch layer. Host
      # networking for the build only; the runtime container still uses compose DNS.
      network: host
      args:
        VCS_REF: ${VCS_REF:-unknown}
    image: findmydreamcollege/pipeline:${FMD_IMAGE_TAG:-local}
    command: ["uvicorn", "fmd.api:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [fmd-net]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fmd}:${POSTGRES_PASSWORD:-fmd}@db:5432/${POSTGRES_DB:-fmd}
      FMD_CONFIG_DIR: /config
      FMD_MIGRATIONS_DIR: /db/migrations
      FMD_SNAPSHOT_DIR: /data/snapshots
      # Opt-in: `make seed` is the explicit path; set to 1 for auto-seed on boot.
      FMD_AUTO_SEED: ${FMD_AUTO_SEED:-0}
      # OCR tier endpoints (T2 Qwen3-VL service, T2b PaddleOCR-VL shim). Empty
      # T2B means "not deployed": the tier raises TierUnavailable and the document
      # goes to the human queue instead of producing claims from a guess.
      FMD_T2_URL: ${FMD_T2_URL_COMPOSE:-http://ocr:8110}
      FMD_T2B_URL: ${FMD_T2B_URL:-}
      # One name for the host text model. The Linux default works because of
      # extra_hosts below; on the host itself use http://localhost:8010/v1.
      FMD_LOCAL_LLM_URL: ${FMD_LOCAL_LLM_URL:-http://host.docker.internal:8010/v1}
    ports: ["${API_PORT:-8000}:8000"]
    # Linux has no built-in host.docker.internal. This alias (Docker >= 20.10)
    # is what makes the host vLLM reachable from any container without an IP.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Docker copies the host's resolv.conf; on hosts using systemd-resolved the
    # 127.0.0.53 stub is unreachable from the container and every fetch fails
    # with "Temporary failure in name resolution". Override per host if needed.
    dns: ["${FMD_DNS_1:-1.1.1.1}", "${FMD_DNS_2:-8.8.8.8}"]
    volumes:
      # Live source edits; the image is complete without this mount.
      - ../packages/pipeline:/app
      - ../config:/config:ro
      # Migrations must match the checkout; a stale baked copy silently blocks
      # newly added columns while reporting "up to date".
      - ../db:/db:ro
      - snapshots:/data/snapshots
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); sys.exit(0 if d.get('status')=='ok' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.pipeline
      # BuildKit's default bridge has no resolvable DNS on this host (2026-11-16:
      # download.pytorch.org -> "dns error"), which aborts the torch layer. Host
      # networking for the build only; the runtime container still uses compose DNS.
      network: host
      args:
        VCS_REF: ${VCS_REF:-unknown}
    image: findmydreamcollege/pipeline:${FMD_IMAGE_TAG:-local}
    command: ["python", "-m", "fmd.cli", "worker"]
    networks: [fmd-net]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fmd}:${POSTGRES_PASSWORD:-fmd}@db:5432/${POSTGRES_DB:-fmd}
      FMD_CONFIG_DIR: /config
      FMD_MIGRATIONS_DIR: /db/migrations
      FMD_SNAPSHOT_DIR: /data/snapshots
      FMD_AUTO_SEED: "0"
      FMD_T2_URL: ${FMD_T2_URL_COMPOSE:-http://ocr:8110}
      FMD_T2B_URL: ${FMD_T2B_URL:-}
      FMD_LOCAL_LLM_URL: ${FMD_LOCAL_LLM_URL:-http://host.docker.internal:8010/v1}
    extra_hosts: ["host.docker.internal:host-gateway"]
    dns: ["${FMD_DNS_1:-1.1.1.1}", "${FMD_DNS_2:-8.8.8.8}"]
    volumes:
      - ../packages/pipeline:/app
      - ../config:/config:ro
      - ../db:/db:ro
      - snapshots:/data/snapshots
    depends_on:
      # Migrations + seed are done by api's entrypoint before it reports healthy.
      api: {condition: service_healthy}
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      # Thin wrapper adding the NEXT_PUBLIC_API_URL build ARG; see the header
      # of infra/Dockerfile.web for why apps/web/Dockerfile is not used directly.
      dockerfile: ../../infra/Dockerfile.web
      # Next inlines NEXT_PUBLIC_* at build time, so this must be a build arg.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    networks: [fmd-net]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  dbdata:
  snapshots:
