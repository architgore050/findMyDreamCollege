[project]
name = "fmd"
version = "0.1.0"
description = "findMyDreamCollege evidence pipeline: registry, snapshots, model router, DB repositories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "PyYAML>=6.0.1,<7",
    "httpx>=0.27,<1",
    "python-dateutil>=2.9,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Heavy, workstream-owned dependencies. Never installed in the base image (brief §21).
# The stealth browser tier is the external invisible-playwright-mcp server
# (spawned over stdio), driven by the official `mcp` SDK below — no in-process
# browser engine is a Python dependency anymore.
crawl = [
    "scrapy>=2.11,<3",
    "curl_cffi>=0.7,<1",
    "mcp>=1.19,<2",
    "tldextract>=5,<6",
    "protego>=0.3,<1",
    "duckdb>=1.0,<2",
]
extract = [
    "pypdfium2>=5,<6",
    "pdftext>=0.4,<1",
    "docling>=2.0,<3",
]
er = [
    "splink>=4.0,<5",
    "duckdb>=1.0,<2",
    "sentence-transformers>=3.0,<4",
]
# The in-process T2 runner (`fmd.acquire.rapidocr_backend`). These are the
# imports the backend actually makes: `from rapidocr import RapidOCR`,
# `import onnxruntime`, `import pypdfium2 as pdfium`. Pins mirror
# infra/ocr/requirements.txt; onnxruntime is the CPU wheel unless a CUDA build
# is supplied separately. Absent => T2 `TierUnavailable`; `fmd llm doctor`
# reports it as `unavailable:<reason>` instead of pretending OCR works.
ocr = [
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.32,<2",
    "pypdfium2>=5,<6",
]
# `uv sync --extra X` REPLACES the environment, so a crawl-only sync uninstalls
# extraction deps and silently skips tests. `all` composes every workstream extra
# explicitly (duplication is intentional: extras cannot reference other extras).
# Use `uv sync --all-extras` for development and CI; never sync a single extra.
all = [
    "scrapy>=2.11,<3",
    "curl_cffi>=0.7,<1",
    "mcp>=1.19,<2",
    "tldextract>=5,<6",
    "protego>=0.3,<1",
    "duckdb>=1.0,<2",
    "pypdfium2>=5,<6",
    "pdftext>=0.4,<1",
    "docling>=2.0,<3",
    "splink>=4.0,<5",
    "sentence-transformers>=3.0,<4",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.32,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
fmd = "fmd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:launch_testing -p no:launch_ros"
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:fmd.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["fmd"]
