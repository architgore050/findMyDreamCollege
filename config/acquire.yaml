# Acquisition policy (brief §9). Every threshold and backend name lives here;
# Python reads this file through the registry and hardcodes none of it.
#
# Tiers
#   T0  pdftext           born-digital text layer, per-glyph boxes
#   T1  Docling           layout + tables on clean scans, item/table-cell boxes
#   T2  OCR               backend matrix: rapidocr (default) | qwen3vl | paddleocr
#   T2b PaddleOCR-VL      alternate OCR engine; CPU-only on this sm_120 host
#   T3  human queue       anomalies, low confidence; never an automated model
#
# T2 backend matrix (W7, 2026-11-19). RapidOCR is the RUNNER, not the model: an
# onnxruntime wrapper around PaddleOCR PP-OCR det+rec graphs. Purpose-built
# detection+recognition is orders of magnitude cheaper per page than a VLM, and
# a VLM over a 200-page scan is exactly what stalled the corpus (D18). This
# preference is PROVISIONAL UNTIL MEASURED: `scripts/ocr_validate.py
# --ground-truth` computes CER/chrF++/pages-min per engine over the same scans;
# the committed decision rule (runbook §3.8) — not this file — is what a
# measured result changes. Table structure is NOT OCR's job (Docling keeps it).
# Qwen3-VL stays fully wired: the Devanagari fallback (T2.devanagari_fallback)
# and a selectable T2 backend. No engine is deleted by this patch.
#
# Rejected and not to be reintroduced: PyMuPDF (AGPL), Surya/Marker weights
# (OpenRAIL-M, $5M revenue cap), MiniCPM-OCR/GLM-OCR for Hindi (no `hi` in the
# language list).

version: "1"

tiers:
  # Text layer with at least this many characters per page is readable as-is.
  text_min_chars_per_page: 200
  table_min_rows: 3
  table_min_numeric_columns: 2
  devanagari_forces_t2: true
  # T1 table output below this share of unambiguous numeric cells escalates to T2.
  t1_table_confidence_min: 0.6
  # T2 output with Devanagari must pass this ratio or T2b runs. The ratio is
  # Devanagari codepoints / (Devanagari + Latin letters) on Devanagari lines, so
  # a mixed Hindi/English header still passes; Latin mojibake scores near 0.
  t2_indic_self_check_min_ratio: 0.5
  # The self-check needs evidence. A transcript with fewer Devanagari
  # codepoints than this is not a Hindi page (one stray glyph read off a logo
  # must not push an English scan into the fallback engine).
  t2_indic_self_check_min_chars: 5
  # Deterministic 1% field audit (sha256-keyed, never random).
  adjudication_sample_rate: 0.01

# Repetition / entropy guard. Scoped to OCR output (T2, T2b) only: a decoder
# loop is a model failure. T0 (pdftext) and T1 (Docling) read a real text layer,
# so a long block there is evidence, not an anomaly — those tiers are never
# routed to T3 on length. The page-median rule below is a log diagnostic only.
anomaly:
  # T0/T1 diagnostic: a block longer than this multiple of the page median
  # block length logs a warning and continues to extraction. Catches layout
  # extractors that merge a whole table into one item; never refuses a document.
  block_length_multiplier: 3.0
  # OCR only: a block whose character entropy is below this share of the page
  # reference has collapsed (decoder loop).
  entropy_ratio_floor: 0.45
  # OCR only: blocks below this many characters are not inspected.
  min_block_chars: 120
  # OCR only: entropy is only judged on pages longer than this.
  min_page_chars: 80
  # A repeated unit must repeat at least this many times to be a loop. A 71×
  # decoder repeat trips; a table header repeated twice does not.
  repeated_block_min_occurrences: 20
  # OCR only: absolute ceiling for one block. A scanned A4 page holds roughly
  # 4k characters; a single block above this is a runaway decode, not a table.
  ocr_block_chars_cap: 6000
  # OCR only: absolute ceiling for one page's total text. This is the baseline a
  # loop inflates (the block is part of the page, so a page-median comparison
  # cannot see it); a page above this cannot be a real scan.
  ocr_page_chars_cap: 12000
  # OCR only: share of a block covered by its most repeated unit. An exact
  # periodic block (or one repeated line) scores ~1.0; a dense fee table with
  # varied numbers scores low and is not refused.
  ocr_repeated_substring_ratio: 0.5
  # OCR only: an interior page (not first/last) with fewer than this many
  # characters between substantial pages is a truncated decode.
  ocr_truncated_page_min_chars: 80
  # OCR only: truncation needs at least this many pages to judge neighbours.
  ocr_truncated_page_min_pages: 3

backends:
  T0:
    tool: pdftext
    model: pdftext
    granularity: glyph
  T1:
    tool: docling
    model: docling
    granularity: span
    # Device for the RT-DETR layout + TableFormer models. Default `cpu` on
    # purpose: a local LLM server (llama-server, ~14 GiB at 64k) is normally
    # resident on the only 16 GB GPU, and a second CUDA consumer OOMs the
    # acquisition pass. `auto` restores Docling's own detection; `cuda` is an
    # explicit opt-in for a host with a free card. Override per shell with
    # FMD_DOCLING_DEVICE (same values) without editing this file.
    device: ${FMD_DOCLING_DEVICE:-cpu}
    # CUDA preflight: fail before loading a model when less than this is free.
    # Only consulted when device resolves to cuda/cuda:N; a starved card is a
    # named acquisition failure, never a silent fallback to flat T0 text.
    min_free_vram_gib: 1.0
    # Local artifact cache for the layout and table-structure models. Docling
    # downloads these from Hugging Face on first use; that fetch is exactly what
    # stalls an extraction when the host has no network. Point this at a
    # directory populated once, online, with `docling-tools models download`.
    # Empty + FMD_OFFLINE=1 => `artifacts_unavailable_offline` in <1 s, routed
    # to T3 with that stable reason instead of a timeout.
    artifacts_path: ${FMD_DOCLING_ARTIFACTS:-}
  T2:
    # ---- engine selection matrix -------------------------------------------
    # rapidocr  — in-process PP-OCR det+rec over the RapidOCR runner
    #             (onnxruntime). Default on this host. No HTTP service.
    # qwen3vl   — Qwen3-VL-8B behind the /extract service (FMD_T2_URL). The
    #             Devanagari fallback and an explicit alternate backend;
    #             never the default, never removed, never silently used.
    # paddleocr — PaddleOCR-VL behind the same /extract contract (start the
    #             service with FMD_OCR_BACKEND=paddleocr; CPU-only on sm_120).
    backend: ${FMD_T2_BACKEND:-rapidocr}
    tool: rapidocr
    model: PP-OCRv6-det-small + PP-OCRv5-devanagari-rec (RapidOCR runner)
    granularity: block
    # Used only when backend is qwen3vl/paddleocr: FMD_T2_URL=http://localhost:8110
    # on the host, http://ocr:8110 inside compose (infra/docker-compose.yml,
    # profile "ocr"). Unset => TierUnavailable and the page goes to review.
    endpoint_env: FMD_T2_URL
    # ---- device (MEASURED 2026-11-19, amendment) ---------------------------
    # Default `cpu`: with llama-server resident (14.4 GiB) only ~688 MiB VRAM
    # is free; onnxruntime CUDA needs ~1.5–2 GiB and OOMs. Measured CPU rate
    # 2.33 s/page (25.8 pages/min) => 200 pp ≈ 8 min. `cuda` is opt-in for
    # batch runs with the LLM server stopped; when free VRAM is below
    # min_free_vram_gib the CUDA path fails with a recorded
    # `cuda_unavailable_vram` reason and the run continues on CPU — a device
    # preference never crashes a run. FMD_OCR_DEVICE overrides per shell.
    device: ${FMD_OCR_DEVICE:-cpu}
    # CUDA floor (GiB): onnxruntime CUDA EP needs ~1.5–2 GiB for these graphs.
    min_free_vram_gib: 2.0
    # ---- budgets (D18: bounded, visible, no partial claims) ----------------
    # Per document. max_pages 250 / max_seconds 900 covers a 200-page annual
    # report at the measured CPU rate (480 s) with headroom. An abort is a
    # named `acquisition_failed:acquisition_budget_exceeded`, no claims are
    # published, and the run continues with the next document.
    max_pages: 250
    max_seconds: 900
    # Page raster: rendered at `dpi`, downscaled when the long side exceeds
    # max_side_px (pages[].width/height report the analysed raster).
    dpi: 200
    max_side_px: 2400
    # ---- output hygiene (measured defects handled, not hidden) -------------
    # Boxes below this recognition confidence are dropped AND counted per page
    # (`dropped_low_confidence`), never silently kept.
    min_box_confidence: 0.7
    # Virama/conjunct sequences are error-prone (शक्ति→शक्ि, विश्व→विश्ष): a page
    # whose transcript contains conjunct clusters at low confidence (a dropped
    # box, or mean box score under this ceiling) is flagged `conjunct_risk`.
    conjunct_risk_score_max: 0.85
    # Devanagari digits (०१२३) are untested in our corpus: normalise them to
    # ASCII when detected, log it, and record the count per page.
    normalise_devanagari_digits: true
    # ---- Devanagari fallback (Qwen3-VL stays fully wired) ------------------
    # After a failed Indic self-check, re-run the document through this engine:
    #   qwen3vl — the vLLM endpoint behind endpoint_env (recorded per claim)
    #   t2b     — the alternate-engine tier (legacy behaviour)
    devanagari_fallback: qwen3vl
    # ---- pinned models (no URL guessing; sha256 from the runner's manifest) -
    # Source of truth: ModelScope RapidAI/RapidOCR@v3.10.0. Ids are FILE NAMES
    # under `artifacts_root` (FMD_RAPIDOCR_MODELS); the det graph ships inside
    # the runner wheel, rec + dict are prefetched once (sha256-checked) with
    # `uv run python scripts/ocr_validate.py --prefetch`. Devanagari is a
    # first-class LangRec value in the runner (LangRec.DEVANAGARI).
    models:
      det: PP-OCRv6_det_small.onnx
      rec: devanagari_PP-OCRv5_rec_mobile.onnx
      rec_keys: ppocrv5_devanagari_dict.txt
      lang_rec: devanagari
      source: modelscope:RapidAI/RapidOCR@v3.10.0
      sha256:
        det: "090f04abcd9d9a7498bc4ebf677e4cb9bdce1fe4197ddb7e529f1ef44e1ff94f"
        rec: "d6f0a906580e3fa6b324a318718f1f31f268b6ea8ef985f91c2012a37f52c91e"
      # Default matches the prefetch target documented in the runbook; a
      # relative path resolves against the repository root (never the cwd), so
      # `cd packages/pipeline && uv run …` and the repo root find the same
      # files. FMD_RAPIDOCR_MODELS still wins when it is set.
      artifacts_root: ${FMD_RAPIDOCR_MODELS:-data/rapidocr-models}
    # ---- service block (qwen3vl/paddleocr backends, unchanged contract) ----
    # Defaults are read by infra/ocr/server.py (FMD_OCR_CONFIG,
    # /config/acquire.yaml inside the container). Every value here is
    # env-overridable; nothing model-specific is hardcoded in Python.
    service:
      backend: qwen3vl
      # vLLM on the host, OpenAI-compatible. `scripts/serve_ocr.sh vision-start`
      # serves exactly this pair. Served name must match --served-model-name.
      #
      # hub_id is a DIRECTORY NAME under the host weight root
      # ($FMD_MODEL_DIR, default /home/archit-gore/models), never a Hub id: the
      # weights are host data mounted read-only, and serving must not download.
      # Prefetch once with `scripts/fetch_model.sh Qwen/Qwen3-VL-8B-Instruct-FP8`.
      # Override the path itself with FMD_VLLM_OCR_MODEL (absolute or a name).
      hub_id: Qwen3-VL-8B-Instruct-FP8
      served_name: Qwen3-VL-8B-Instruct
      vllm_url: http://host.docker.internal:8001/v1
      # 10.6 GB of FP8 weights; fits 16 GB with an 8k context. The int4
      # alternative (unsloth/Qwen3-VL-8B-Instruct-bnb-4bit, 7.2 GB) and its
      # trade-offs are documented in docs/.../11-inference-runbook.md.
      json_mode: true
      # Block boxes are requested on a 0..1000 grid and scaled to the analysed
      # raster, so a box always resolves inside its page box.
      bbox_space: normalized_1000
      # Service-side render/budget knobs (infra/ocr/server.py) for the HTTP
      # backends; the in-process rapidocr path reads the T2-level values above.
      dpi: 200
      max_pages: 40
      max_side_px: 2400
      timeout_s: 120
  T2b:
    tool: paddleocr-vl
    model: PaddleOCR-VL-1.6
    granularity: block
    # Same /extract contract, different engine. PaddlePaddle's GPU wheels stop at
    # sm_90, so on this sm_120 host this service is CPU-only: correct but slow.
    # FMD_T2B_URL=http://localhost:8111 (host) — no service starts by default;
    # enable it with `docker compose --profile ocr-paddle up -d ocr-paddle`.
    endpoint_env: FMD_T2B_URL
    service:
      backend: paddleocr
      served_name: PaddleOCR-VL-1.6
      device: cpu
      dpi: 200
      max_pages: 40
      max_side_px: 2400
      timeout_s: 300
  T3:
    tool: human_queue
    model: human
    granularity: block

bbox:
  # Tolerance when checking a span box against its page box (PDF points).
  page_epsilon: 1.0
  # Documents acquired through these tiers must have bbox coverage 1.0.
  # OCR pages (T2/T2b) are reportable but not gated: block boxes cannot be
  # finer than a block, so a 1.0 gate there would be a false promise.
  gate_tiers:
    - T0
    - T1
