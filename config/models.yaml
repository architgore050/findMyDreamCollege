# Provider-agnostic model routing. Nothing in the pipeline may hardcode a provider.
# Everything below is env-switchable: change a provider or model without editing
# this file, e.g. FMD_EXTRACT_PROVIDER=anthropic FMD_EXTRACT_MODEL=claude-3-5-sonnet.
# `local` is llama.cpp `llama-server` exposing an OpenAI-compatible endpoint
# (decision 2026-11-17, docs/.../10-inference-and-model-selection.md).
# Hardware budget: 16 GB VRAM. Served today: Gemma 4 26B-A4B (MoE, ~4B active)
# at UD-IQ4_XS = 12.66 GiB of weights, 64k context, 8-bit KV cache.
# Do not plan on a 70B dense local model; a 26B *MoE* is the intended shape.
# Run `fmd llm doctor` to see what resolved and which env var is missing.
#
# Offline mode (docs/.../11-inference-runbook.md §7): set FMD_OFFLINE=1 (and
# HF_HUB_OFFLINE=1, HF_HUB_DISABLE_TELEMETRY=1) to forbid artifact downloads.
# This file is unchanged by offline mode: `local` still points at a vLLM server
# that must already be running, `api`/`anthropic`/`gemini` are simply
# unreachable, and `mock` is the only profile that answers without a server.
# Docling's cache path is acquisition config, not a model profile:
# config/acquire.yaml:backends.T1.artifacts_path (FMD_DOCLING_ARTIFACTS).

providers:
  local:
    # Single knob for the host vLLM. On the host the default is localhost; inside
    # compose, infra/docker-compose.yml sets the same variable to
    # http://host.docker.internal:8010/v1 and defines that alias via
    # `extra_hosts: ["host.docker.internal:host-gateway"]` (Linux has no such
    # name out of the box). Never put a container-only hostname here as default.
    base_url: ${FMD_LOCAL_LLM_URL:-http://localhost:8010/v1}
    api_key: ${FMD_LOCAL_LLM_KEY:-not-needed}
    kind: openai_compatible
    base_url_env: FMD_LOCAL_LLM_URL
    api_key_env: FMD_LOCAL_LLM_KEY
    requires_api_key: false
    supports_guided_json: true
    base_url_example: http://localhost:8010/v1
  api:
    base_url: ${FMD_API_LLM_URL}
    api_key: ${FMD_API_LLM_KEY}
    kind: openai_compatible
    base_url_env: FMD_API_LLM_URL
    api_key_env: FMD_API_LLM_KEY
    requires_api_key: true
    supports_guided_json: true
    base_url_example: https://api.openai.com/v1
    # Shared fallback model for profiles whose provider resolves to `api`.
    # `hard_pdf` (the only profile that defaults to this provider) reads it
    # directly: set FMD_API_MODEL once instead of a per-profile model var.
    # Profiles switched to `api` by env still carry their own model var
    # (FMD_ADJUDICATE_MODEL, FMD_NLP_MODEL); set those or point them here.
    model: ${FMD_API_MODEL:-}
    model_env: FMD_API_MODEL
  anthropic:
    base_url: ${FMD_ANTHROPIC_URL:-https://api.anthropic.com/v1}
    api_key: ${FMD_ANTHROPIC_KEY}
    kind: anthropic
    base_url_env: FMD_ANTHROPIC_URL
    api_key_env: FMD_ANTHROPIC_KEY
    requires_api_key: true
    supports_guided_json: true
    base_url_example: https://api.anthropic.com/v1
  gemini:
    base_url: ${FMD_GEMINI_URL:-https://generativelanguage.googleapis.com/v1beta}
    api_key: ${FMD_GEMINI_KEY}
    kind: gemini
    base_url_env: FMD_GEMINI_URL
    api_key_env: FMD_GEMINI_KEY
    requires_api_key: true
    supports_guided_json: true
    base_url_example: https://generativelanguage.googleapis.com/v1beta
  mock:
    kind: replay
    fixtures_dir: packages/pipeline/tests/fixtures/llm

profiles:
  bulk_extract:
    # evidence: best doc evidence per GB
    # Served by llama-server (GGUF), not vLLM. Weights are the *raw* (non-QAT)
    # unsloth/gemma-4-26B-A4B-it-GGUF at UD-IQ4_XS, 12.66 GiB, chosen over the
    # QAT variants on retained capability (operator experience, 2026-11-17).
    # Thinking must be off for deterministic extraction; fmd/llm/providers.py
    # does not forward `thinking` yet, so scripts/serve_local.sh disables it in
    # the served chat template (-rea off + chat-template-kwargs
    # {"enable_thinking":false}). Keep those flags: without them the answer
    # lands in `reasoning_content` and `content` is empty.
    #
    # Served name, not a hub id: `scripts/serve_local.sh` starts llama-server as
    #   --alias gemma-4-26b-a4b-gguf -c 65536 -fa on -ctk q8_0 -ctv q8_0
    #   -b 4096 -ub 2048 -np 1
    # (-b/-ub chosen by sweep 2026-11-18: +24% prefill, decode flat, 64k keeps
    # 1,153 MiB free; see runbook §2.8). Change this string only together with
    # the script's --alias, or every call 404s with "model not found".
    provider: ${FMD_EXTRACT_PROVIDER:-local}
    model: ${FMD_EXTRACT_MODEL:-gemma-4-26b-a4b-gguf}
    provider_env: FMD_EXTRACT_PROVIDER
    model_env: FMD_EXTRACT_MODEL
    model_example: gemma-4-26b-a4b-gguf
    temperature: 0
    guided_json: true          # llama.cpp response_format json_schema -> GBNF
    max_tokens: 4096
    context_tokens: 65536      # must be <= the server's -c; measured ceiling
                               # at -ub 2048 is 64k (runbook §2.8)
    quantization: int4
    thinking: false
    required: true             # text PDFs cannot be extracted without this
  hard_pdf:
    # evidence: hosted escalation on local failure
    # CHOICE (2026-11-16): hosted fallback, not local vision. The API provider is
    # the only one that can serve a vision-capable id on this host without a new
    # multigigabyte download, and local vision is already a first-class *stage*
    # (config/acquire.yaml T2, Qwen3-VL-8B on :8001) rather than a router profile.
    # Pairing `local` with an API model id (the old .env) was the defect: a local
    # provider must name a model that vLLM actually serves on :8000.
    # `hard_pdf` is thus the only profile that defaults to `api`; it reads the
    # shared FMD_API_MODEL directly — one variable for the hosted fallback.
    # Unset => model is None => this optional profile degrades per document with
    # `vision_unavailable`; text PDFs still extract.
    provider: ${FMD_HARD_PDF_PROVIDER:-api}
    # No `:-` default: an unset FMD_API_MODEL must interpolate to None, which is
    # what "unset => degrades per document" means. `:-` would yield "" and make
    # the doctor report an empty model instead of an unresolved one.
    model: ${FMD_API_MODEL}
    provider_env: FMD_HARD_PDF_PROVIDER
    model_env: FMD_API_MODEL
    model_example: gemini-2.5-flash
    temperature: 0
    guided_json: true
    max_tokens: 8192
    required: false            # scanned/hard PDFs degrade per document
    degrade_reason: vision_unavailable
  adjudicate:
    # evidence: mid-tier cross-check, cheap
    # gemini-2.5-flash is the documented example; it is scheduled to reroute to
    # gemini-3.5-flash-lite (same price) on 2026-12-01. Either is env-overridable.
    provider: ${FMD_ADJUDICATE_PROVIDER:-gemini}
    model: ${FMD_ADJUDICATE_MODEL:-gemini-2.5-flash}
    provider_env: FMD_ADJUDICATE_PROVIDER
    model_env: FMD_ADJUDICATE_MODEL
    model_example: gemini-2.5-flash
    temperature: 0
    guided_json: true
    bundle_pairs_per_call: 20
    required: false
  entity_adjudication:
    # evidence: pairwise match stays local
    provider: ${FMD_ENTITY_ADJUDICATE_PROVIDER:-local}
    model: ${FMD_ENTITY_ADJUDICATE_MODEL:-gemma-4-26b-a4b-gguf}
    provider_env: FMD_ENTITY_ADJUDICATE_PROVIDER
    model_env: FMD_ENTITY_ADJUDICATE_MODEL
    model_example: gemma-4-26b-a4b-gguf
    temperature: 0
    guided_json: true
    context_tokens: 65536
    quantization: int4
    thinking: false
    bundle_pairs_per_call: 20
    required: false
  nlp_rubric:
    # evidence: mid-tier rubric, full context
    provider: ${FMD_NLP_PROVIDER:-gemini}
    model: ${FMD_NLP_MODEL:-gemini-2.5-flash}
    provider_env: FMD_NLP_PROVIDER
    model_env: FMD_NLP_MODEL
    model_example: gemini-2.5-flash
    temperature: 0
    require_quoted_evidence: true
    required: false
  verify:
    # evidence: structurally different second pass over the bounded source
    # window; it sees the existing quote, never the claimed value, and emits a
    # judgement only (supported | contradicted | absent | wrong_field).
    # Sampling/budget is deliberately config-driven: one profile, one prompt
    # version, and a hard per-run cap. 0 price means the local default; a hosted
    # verifier only needs an env override, never a code change.
    provider: ${FMD_VERIFY_PROVIDER:-local}
    model: ${FMD_VERIFY_MODEL:-gemma-4-26b-a4b-gguf}
    provider_env: FMD_VERIFY_PROVIDER
    model_env: FMD_VERIFY_MODEL
    model_example: gemma-4-26b-a4b-gguf
    temperature: 0
    guided_json: true
    max_tokens: 1024
    context_tokens: 65536
    quantization: int4
    thinking: false
    required: false            # claims stay unverified when this profile degrades
    degrade_reason: verifier_unavailable
    prompt_name: verify
    prompt_version: v1
    window_chars: 1200
    bundle_fields_per_call: 8
    max_claims_per_run: 500
    max_usd_per_run: 0.05
    repair_attempts_per_claim: 1
    pricing: {input_per_mtok: 0.0, output_per_mtok: 0.0}
    cost_model: {input_tokens_per_call: 900, output_tokens_per_call: 120}
  # NOTE: there is no `ocr_vlm` profile. OCR is an acquisition *stage* (T2/T2b
  # in config/acquire.yaml), served as a block-extraction HTTP service, not an
  # OpenAI-compatible chat endpoint. Retiring the profile keeps `fmd llm doctor`
  # honest: a vision model is not a router target and must never be scored as one.
  embed:
    # evidence: multilingual 1024-dim baseline
    provider: ${FMD_EMBED_PROVIDER:-local}
    model: ${FMD_EMBED_MODEL:-BAAI/bge-m3}
    provider_env: FMD_EMBED_PROVIDER
    model_env: FMD_EMBED_MODEL
    model_example: BAAI/bge-m3
    dim: 1024
    required: false

budgets:
  daily_usd: 5.00
  per_run_usd: 2.00
  hard_stop: true
  cache: true                 # keyed by (purpose, prompt_sha256, input_sha256, model)

routing_rules:
  - if: {doc_kind: pdf_scan, pages_gt: 30}
    use: hard_pdf
  - if: {doc_kind: pdf_text}
    use: bulk_extract
  - if: {purpose: entity_adjudication}
    use: adjudicate
  - default: bulk_extract

# Note: the trigger key must stay quoted. Unquoted `on:` is a YAML 1.1 boolean
# (True), which silently corrupts the key before pydantic ever sees it.
fallbacks:
  - {"from": local, "to": api, "on": [connection_error, timeout, json_schema_violation]}
  - {"from": anthropic, "to": api, "on": [connection_error, timeout, json_schema_violation]}
  - {"from": gemini, "to": api, "on": [connection_error, timeout, json_schema_violation]}
  - {"from": api, "to": mock, "on": [budget_exhausted]}
