    trust: high
    adapter: state_counselling
    enabled: true
    params:
      extraction_family: seat_matrix
      listing_urls:
        - https://cetcell.mahacet.org/notices/
      pdf_href_pattern: '\.pdf$'
      link_text_pattern: '(?i)seat matrix|cutoff|cut-off|last rank|brochure|prospectus|notification|schedule'
      date_pattern: '(?P<date>\d{4}[-_]\d{2}[-_]\d{2})'
    notes: >-
      WordPress; ~70 PDF links/page, /notices/page/<n>/ pagination. robots is a
      Googlebot/Bingbot allow-list with no `User-agent: *` group, so crawl
      conservatively at 0.5 rps and record the parsing decision (spec §4.5).


