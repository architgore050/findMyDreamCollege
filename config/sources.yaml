  # ---------- fees ----------
  - id: fee_regulators
    name: State fee regulatory commissions (MH, RJ, KL, TN, MP)
    base_url: null
    kind: fees
    format: pdf_scan
    cadence_days: 365
    trust: high
    adapter: fee_regulator
    enabled: true
    params:
      extraction_family: fee_structure
      order_href_pattern: '(?i)\.pdf($|\?)'
      order_text_pattern: '(?i)fee|order|notification|gazette'
      assume_scanned: true
      scan_hint_pattern: '(?i)scan|gazette'
      form_markers: ['<select', 'sub_type']
      portals:
        # Verified 2026-11-16 (spec §4.6.1): a search form whose sub_type list is
        # populated by JS and whose vocabulary is unknown. No order PDF is
        # reachable without a browser session, so this abstains loudly.
        - id: maharashtra
          listing_url: https://ay25-26.mahafraportal.org/ssi_prp_24/outer.php?q=fee_search_report
          mode: form
          verified: true
        # No verified FRC order listing for these states on 2026-11-16.
        - id: kerala
          listing_url: null
          mode: html
          verified: false
        - id: rajasthan
          listing_url: null
          mode: html
          verified: false
        - id: tamil_nadu
          listing_url: null
          mode: html
          verified: false
        - id: madhya_pradesh
          listing_url: null
          mode: html
          verified: false
    notes: Scanned orders, inconsistent coverage, often only professional courses. Partial by design.

