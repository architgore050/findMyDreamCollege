# Source registry. Every crawled URL must be attributable to an entry here or to a
# query template. `adapter` maps to fmd/adapters/<adapter>.py
#
# kind:     inventory | regulator | quality | admissions | fees | financing | clinical | payload | institution
# format:   html | html_paginated | pdf | pdf_scan | excel | js_dashboard | api
# trust:    high (primary/official) | medium (aggregator) | low (self-reported promotional)

sources:
  # ---------- inventory ----------
  # Spec §4.1.1: the payload is a JSON XHR, not paginated HTML. The 200-status
  # error shell for unknown paths is a trap (spec §1, §4.1.2).
  - id: ugc_university_list
    name: UGC recognised universities (JSON XHR)
    base_url: https://www.ugc.gov.in/universitydetails/Getuniversity_details
    kind: inventory
    format: api
    cadence_days: 30
    trust: high
    adapter: ugc
    enabled: true
    params:
      api_endpoint: https://www.ugc.gov.in/universitydetails/Getuniversity_details
      unitype_param: unitypeID
      unitype_ids: [0, 1, 2, 3, 4]
      # Role policy (migration 0004): the XHR is an inventory payload, an HTML
      # shell is a navigation page, and a PDF is evidence. The URL itself marks
      # the JSON payload even when a proxy mislabels the content type.
      document_role:
        structured: inventory
        page: navigation
        document: evidence
      structured_url_patterns:
        - '(?i)getuniversity_details'
      # Inventory ingestion: field map + filters. The ingester reads only these
      # columns and never guesses a name.
      inventory:
        list_key: List
        country: IN
        fields:
          name: uni_name
          state: state
          type: uni_type
          website: url
          status: status
      # Only these keys may enter a DocumentRef / normalised row. Contact and
      # auth fields are dropped on ingest (spec §2.6, §4.1.1).
      field_whitelist:
        - ID
        - uni_name
        - uni_type
        - status
        - state
        - address
        - Zip
        - url
        - ESTD
        - AIshe_code
        - college
        - Type
        - uniportal_id
    pii_fields:
      - user_password
      - user_username
      - created_Ip
      - created_Mac
      - updated_Ip
      - updated_Mac
      - Nodal_Mob
      - Nodal_Email
      - Nodal_Phn
      - NM_VC
      - NM_REG
      - NM_Nodal
      - VCPNO
      - VCPNOR
      - VCFNO
      - VCMOB
      - VCE_ML
      - RPNO
      - RPNOR
      - RFNO
      - REMOB
      - RE_ML
      - UPNO
      - UPNO1
      - U_EMAIL
      - Nodal_Dept
      - Nodal_Desg
    notes: >-
      unitypeID=0 is the union (verified 1,304 rows); 1=57 central, 2=523 state,
      3=560 private, 4=164 deemed at spec verification. Unknown paths return
      HTTP 200 with a ~51 KB HTML error shell, so status is not evidence.
      A university in this list is recognised as a university, never as running
      an MLT programme.

  # Spec §4.1.2: /oldpdf/ is a 200 error shell, not a listing. Disabled until a
  # human supplies a real consolidated-list URL; the JSON source supersedes it.
  - id: ugc_consolidated_lists
    name: UGC consolidated university PDFs (disabled)
    base_url: https://www.ugc.gov.in/oldpdf/
    kind: inventory
    format: pdf
    cadence_days: 90
    trust: high
    adapter: ugc_pdf
    enabled: false
    verify_first: true
    notes: >-
      Verified 2026-11-16: /oldpdf/ returns HTTP 200 with the 51,908-byte UGC
      error shell, not a PDF index. Do not re-enable without a real URL and a
      sha256 per annual edition.

  # Spec §4.1.3: static xlsx path recorded, but NOT verified from this host
  # (connection code 000 = DNS/TLS/egress, not 404). Keep disabled until a fetch
  # succeeds; the adapter abstains with an explicit status rather than emitting
  # an empty success.
  - id: aishe_reports
    name: AISHE final reports (static xlsx, verify first)
    base_url: https://aishe.gov.in/aishe-final-report/
    kind: inventory
    format: excel
    cadence_days: 365
    trust: high
    adapter: aishe
    enabled: false
    verify_first: true
    params:
      listing_url: https://aishe.gov.in/aishe-final-report/
      report_link_pattern: '#/report/([0-9]{4}-[0-9]{2})'
      asset_url_template: https://he.nic.in/aishereport/assets/excel/{report_id}.xlsx
      static_xlsx_url: https://he.nic.in/aishereport/assets/excel/2023-24.xlsx
      verified: false
    notes: >-
      Spec §4.1.3 verified the 2023-24 / 2022-23 xlsx paths at he.nic.in, but a
      fetch from the dev host returned connection code 000 (DNS/TLS/egress, not
      404). Treat as unverified until a fetch succeeds. Self-reported, voluntary,
      ~18-month lag; aggregate enrolment only, never seats.


  # ---------- regulator (drives hard filters) ----------
  - id: ncahp
    name: National Commission for Allied and Healthcare Professions
    base_url: https://ncahp.abdm.gov.in/
    kind: regulator
    format: pdf
    cadence_days: 30
    trust: high
    adapter: ncahp
    enabled: true
    notes: Act 2021, MLS 2025 curriculum, AHP Registration Regulations 2026. Drives recognition_status.

  - id: state_paramedical_councils
    name: State allied-health / paramedical councils
    base_url: null
    kind: regulator
    format: mixed_html_pdf
    cadence_days: 90
    trust: medium
    adapter: state_council
    enabled: true
    requires_manual_review: true
    params:
      # The NCAHP notification list is the only authoritative "this state has a
      # council" source (spec §4.2.2). Council websites are added per state, each
      # with the NCAHP notification URL that admits it.
      listing_url: https://ncahp.abdm.gov.in/StateCouncil
      notification_href_pattern: '(?i)/statecouncil/.*\.pdf$'
      rules_href_pattern: '(?i)statecouncil/SAHC_Rules/'
      notification_date_pattern: '(?P<date>\d{1,2}[.]\d{1,2}[.]\d{4})'
      require_ncahp_host: true
      ncahp_host_suffix: abdm.gov.in
      statutory_host_suffixes: [gov.in, nic.in, ac.in]
      # Words removed before deriving a state *token* from the notification
      # filename. Tokens are hints; canonical state names belong to ER.
      state_token_strip:
        - notification
        - notifications
        - notifcation
        - notificationcombined
        - state
        - statecouncil
        - council
        - allied
        - healthcare
        - health
        - professional
        - professionals
        - sahc
        - rules
        - rule
        - order
        - govt
        - government
        - revised
        - nominated
        - members
        - board
        - latter
        - letter
        - merged
        - compressed
        - new
        - pdf
      # Human-approved statutory council sites. Only Kerala was verifiable on
      # 2026-11-16 (spec §4.2.2); it publishes no institution register.
      council_sites: []
    notes: >-
      No single portal; several states have no functioning council site. Discovery
      is `ncahp_state_council_notifications`: NCAHP publishes the constituting
      notification per state, not council URLs. A council site is admissible only
      if it appears in an NCAHP notification, is on a *.gov.in/*.nic.in/*.ac.in
      host, or a human adds it with the NCAHP source URL. Add a state only with
      that source URL, never from a search result alone.

  # ---------- affiliating universities ----------
  - id: state_health_universities
    name: State health-science universities (affiliated college lists)
    base_url: null
    kind: inventory
    format: mixed_html_pdf
    cadence_days: 90
    trust: high
    adapter: health_university
    enabled: true
    seeds:
      - https://ruhsraj.org
      - https://wbuhs.ac.in
      - https://www.tnmgrmu.ac.in
      - https://bfuhs.ac.in
      - https://www.knruhs.telangana.gov.in
    params:
      # One generic adapter, per-domain discovery mode (spec §4.1.4). A seed
      # without a verified entry is skipped with a reason, never guessed at.
      max_pages: 5
      college_pattern: '(?i)college|institut'
      pdf_href_pattern: '(?i)\.pdf($|\?)'
      document_text_pattern: '(?i)college|affiliat|syllabus|seat|course|prospectus'
      js_shell_markers: ['<div id="root"', '<script']
      js_shell_min_anchors: 1
      navigate_pattern: '(?i)affiliat|college|institution|courses?'
      # The university's own college-list pages are inventory (they name
      # institutions); the affiliation PDFs it links are evidence. Both are
      # classified from the fetched bytes by fmd.plan.roles.
      document_role:
        page: inventory
        document: evidence
        structured: inventory
      per_domain:
        ruhsraj.org:
          mode: html
          verified: true
          listing_url: https://ruhsraj.org/affiliated-colleges/
        tnmgrmu.ac.in:
          mode: sitemap
          verified: true
          sitemap_url: https://www.tnmgrmu.ac.in/wp-sitemap-posts-page-1.xml
          sitemap_path_pattern: '(?i)affiliat|college|course'
        wbuhs.ac.in:
          mode: html
          verified: false
          note: college list not located on 2026-11-16 (spec §4.1.4)
        bfuhs.ac.in:
          mode: html
          verified: false
          note: content moved to bfuhs.ggsmch.org / examination.bfuhsonline.ac.in
        knruhs.telangana.gov.in:
          mode: nav
          verified: false
          note: programme pages seen via wp-json; college-list entry point unconfirmed

  # ---------- quality ----------
  - id: naac_results
    name: NAAC accreditation results
    # Spec §4.3.1: http:// times out; only https:// works (incomplete cert chain,
    # so the fetch layer must trust the missing intermediate, never disable TLS).
    base_url: https://naac.gov.in/index.php/en/19-quick-links/62-accreditationresults
    kind: quality
    format: html
    cadence_days: 30
    trust: high
    adapter: naac
    enabled: true
    params:
      # Registry-declared extraction family (migration 0003 / fmd.plan): this
      # source only publishes accreditation results, so the planner does not
      # need to guess from URL/text signals.
      extraction_family: accreditation
      listing_url: https://naac.gov.in/index.php/en/19-quick-links/62-accreditationresults
      pdf_href_pattern: '/images/docs/AccreditationResults/'
      link_text_pattern: '(?i)health scien|1st cycle|2nd cycle|CGPA'
    notes: >-
      Single Joomla page with ~1,539 PDF anchors (born-digital). Do not
      pattern-match filenames; classify by anchor text + table context. The PDF
      carries AISHE code, CGPA and grade (spec §4.3.1).


  - id: nirf_rankings
    name: NIRF rankings (institution-level proxy only)
    base_url: https://www.nirfindia.org/
    kind: quality
    format: html
    cadence_days: 365
    trust: high
    adapter: nirf
    enabled: true
    params:
      # Ranking pages verified 2026-11-16 (spec §4.3.2). No paramedical category
      # exists, so every ref is institution-level only.
      listing_urls:
        - https://www.nirfindia.org/Rankings/2025/OverallRanking.html
        - https://www.nirfindia.org/Rankings/2025/MedicalRanking.html
        - https://www.nirfindia.org/Rankings/2025/UniversityRanking.html
      pdf_href_pattern: '(?i)nirfpdfcdn/[0-9]{4}/pdf/.*\.pdf$'
      year_pattern: '(?P<year>20[0-9]{2})/'
      category_pattern: '(?i)/(?P<category>overall|medical|university)ranking\.html'
      pdf_category_pattern: '(?i)/pdf/(?P<category>[^/]+)/'
    notes: >-
      Spec §4.3.2: default curl UA gets CloudFront 403; must go through the
      escalated tier with a truthful UA. No paramedical category exists, so a
      NIRF rank is institution-level only and must never be attributed to an
      MLT programme. DCS remains login-walled and excluded.

  - id: ugc_autonomous_colleges
    name: UGC autonomous colleges
    base_url: https://www.ugc.gov.in/
    kind: quality
    format: pdf
    cadence_days: 365
    trust: high
    adapter: ugc_pdf
    enabled: true

  # ---------- clinical infrastructure (training-quality proxy) ----------
  # NABL is NOT a source: robots.txt is `Disallow: /` (spec §4.4.1). It is
  # recorded under `exclusions` below and no adapter is built.

  - id: nabh_hospitals
    name: NABH accredited hospitals
    # Spec §4.4.2: nabh.co.in is a parked domain; nabh.co is current.
    base_url: https://nabh.co/
    kind: clinical
    format: json
    cadence_days: 30
    trust: high
    adapter: nabh
    enabled: true
    params:
      listing_url: https://nabh.co/find-a-healthcare-organisation/
      ajax_url: https://nabh.co/wp-admin/admin-ajax.php
      request_method: POST
      action_states: get_states
      action_hospitals: get_hospitals
      state_param: selectState
      page_param: page
      max_pages: 50
      # Verified 2026-11-16: `selectState` is accepted and ignored -- a
      # state-filtered POST returns the same 21,637 global results. Do not
      # sweep states until the server honours the filter. Registry-supplied
      # `states` are used only when this flag is true; no state list lives in code.
      state_filter_supported: false
      states: []
      # Dedupe policy (brief §7). A paginated directory is a structured listing,
      # not a document: text simhash sees 25 rows of boilerplate and calls
      # distinct pages duplicates. Exact sha256 remains the byte key; `identity`
      # mode additionally keeps pages whose hospital identifiers are disjoint.
      dedupe:
        mode: identity
        identity_fields: [acc_no, name]
        simhash_threshold: 3
    notes: >-
      Directory is a WordPress admin-ajax POST (`action=get_hospitals`) returning
      JSON with html/pagination/mapData; no nonce, cookie or CAPTCHA on this path
      (robots.txt explicitly allows /wp-admin/admin-ajax.php). Verified 2026-11-16:
      body `action=get_hospitals&page=1` -> 200, 107,350 B, 25 rows, 866 pages,
      21,637 results. `page` is read only from the POST body -- a GET/query
      `page=2` is silently served as page 1 -- so refs stay POST with the body in
      metadata. A bare GET with no `action` is HTTP 400 with body `0`; the
      adapter now raises http_400 with that body instead of an empty success.
      Paginate conservatively (one page per 2 s when >100 KB).


