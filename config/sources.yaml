  - id: seventh_cpc_pay_matrix
    name: 7th CPC pay matrix (Level 4 — scanned)
    base_url: https://dcsem.gov.in/resources/uploads/rti_links/l4Paymatrix.pdf
    kind: payload
    format: pdf_scan
    cadence_days: 3650
    trust: high
    adapter: pay_matrix
    enabled: true
    verify_first: true
    level: 4
    scanned: true
    params:
      document_url: https://dcsem.gov.in/resources/uploads/rti_links/l4Paymatrix.pdf
      # The Level 4 URL itself is verified (spec §4.7); Level 5/6 is not.
      verified: true
    notes: >-
      Spec §4.7: the known URL is Level 4 (filename l4), 358,030 B, one page,
      zero extractable characters => scanned, route to T2. l5/l6/level5/level6
      all 404, so do not treat this as the Level 5/6 technologist anchor. DA/HRA
      must remain separate or UNKNOWN.

  # ---------- financing ----------
  # Spec §4.8: both financing hosts were unreachable/WAF-rejected from a
  # datacentre IP. An unreachable financing source must surface as UNKNOWN
  # funding data, not "no loans". Adapters attempt once, then abstain.
  - id: vidya_lakshmi
    name: Vidya Lakshmi (loan single window)
    base_url: https://www.vidyalakshmi.co.in/
    kind: financing
    format: html
    cadence_days: 30
    trust: high
    adapter: financing
    enabled: true
    abstain: true
    expect_blocked: true
    notes: >-
      Observed 40 s TCP timeout twice (connection never established), not a 403
      or CAPTCHA. Attempt once per run, then abstain; needs a human reachability
      check from the deploy egress before re-enabling claims.

  - id: csis_subsidy
    name: CSIS interest subsidy scheme
    base_url: https://www.vidyalakshmi.co.in/Students/resources/SubsidyScheme.html
    kind: financing
    format: html
    cadence_days: 30
    trust: high
    adapter: financing
    enabled: true
    abstain: true
    expect_blocked: true
    notes: >-
      Same host/timeout as Vidya Lakshmi. Eligibility for BSc MLT as a
      "professional course" is lender-dependent; mark conditional when obtained.

  - id: pm_vidyalaxmi
    name: PM-Vidyalaxmi (2024)
    base_url: https://pmvidyalaxmi.co.in/
    kind: financing
    format: html
    cadence_days: 30
    trust: high
    adapter: financing
    enabled: true
    abstain: true
    expect_blocked: true
    notes: >-
      F5 WAF "Request Rejected" on every path (302 -> /Page_50x.aspx, 246 B).
      Classify `waf_blocked`, abstain; never escalate to a browser to defeat it.

  # ---------- discovery only ----------
  - id: searxng
    name: Self-hosted SearXNG meta-search
    base_url: http://searxng:8080
    kind: discovery
    format: api
    cadence_days: 1
    trust: low
    adapter: searxng
    enabled: true
    params:
      # `{placeholder}` values are supplied at runtime; leads only, never evidence.
      query_templates:
        - "{institution} placement report"
        - "{institution} BSc MLT"
        - "{institution} seat matrix"
    notes: Query templates only; results are leads, never evidence.

  - id: common_crawl_index
    name: Common Crawl URL index
    base_url: s3://commoncrawl/cc-index/
    kind: discovery
    format: parquet
    cadence_days: 30
    trust: low
    adapter: common_crawl
    enabled: true
    params:
      index_glob: https://data.commoncrawl.org/cc-index/table/cc-main/warc/crawl=*/subset=warc/*.parquet
      # Bare eTLDs, no leading dot. The sweep is bounded to the enabled country.
      domain_suffixes:
        - ac.in
        - gov.in
      # SQL LIKE patterns applied to the indexed URL.
      pdf_url_patterns:
        - "%.pdf"
        - "%.pdf?%"
    notes: Bulk discovery of institutional PDFs. Never evidence.

  # ---------- institution sites (discovered at runtime) ----------
  - id: institution_sites
    name: Discovered institutional domains
    base_url: null
    kind: institution
    format: html
    cadence_days: 90
    trust: low
    adapter: institution_site
    enabled: true
    params:
      # Domains arrive at runtime from discovery (UGC websites, NIRF names).
      # The crawl is bounded and stays on one registrable domain per seed.
      domains: []
      max_depth: 2
      # Bulk-ramp first pass (2026-11-17): small, polite, reversible. A domain
      # gets a cover page plus its highest-ranked links; evidence PDFs are the
      # scarce budget. Raise only after a run's yield is reviewed.
      max_pages_per_domain: 20
      max_documents_per_domain: 3
      yield_check_after: 25
      min_yield_percent: 2
      document_extensions: [.pdf]
      page_extensions: [.html, .htm, .php, .aspx, .jsp]
      document_filename_patterns:
        - '(?i)(ssr|aqar|nirf|placement|annual[-_ ]?report|prospectus|self[-_ ]?study|iqac)'
        - '(?i)(cycle[-_ ]?[12]|criteria[-_ ]?[1-7]|dcs|aishe|feedback)'
      anchor_patterns:
        - '(?i)(ssr|aqar|nirf|placement|annual report|prospectus|self study|iqac|dcs)'
      navigate_patterns:
        - '(?i)(naac|iqac|nirf|placement|downloads?|documents?|annual|report|about|academics)'
      skip_patterns:
        - '(?i)(login|sign[-_ ]?in|sign[-_ ]?up|wp-login|register|apply[-_ ]?online)'
      # A navigation page that matches this is not worth a hop: news, events,
      # galleries, tenders and staff circulars are the budget sinks of a college
      # site. Documents are only ranked last, never dropped. "Admission
      # brochure" moved OUT of this list on 2026-11-18: the brochure itself is
      # fee/seat evidence, so it is boosted via evidence_types instead.
      deprioritise_patterns:
        - '(?i)(news|events?|gallery|photo[-_ ]?gallery|press|media[-_ ]?release)'
        - '(?i)(tender|recruitment|staff[-_ ]?circular|circular[-_ ]?for[-_ ]?staff)'
      # Link ordering only; the classification gate lives in fmd/adapters/links.py.
      link_weights:
        document: 10
        filename_match: 5
        anchor_match: 5
        navigate: 5
        navigate_anchor: 3
        navigate_filename: 2
        deprioritised: -50
      # Evidence-type boost table (W1 2026-11-18). The measured 50-domain run
      # linked accreditation 27 / placement 10 / curriculum 9 / seat_matrix 1 /
      # fee_structure 0: the document cap was spent on SSR/AQAR/NIRF mirrors
      # because fee and seat vocabulary never scored. Each entry matches at
      # filename (link URL) and anchor level; `hint` is the strong phrase subset
      # that carries a family hint to the planner; `negative` vetoes the type on
      # a link whose "fee"/"seat" word is administrative (the observed case was
      # "Guidelines … Fee for recognition of Institution as Research Centre for
      # Ph.D. Course" — never a fee_structure). Entries here override the
      # matching defaults in fmd/adapters/institution_site.py per type.
      evidence_types:
        seat_matrix:
          family: seat_matrix
          filename:
            - '(?i)(seat[-_ ]?matrix|seat[-_ ]?availability|sanctioned[-_ ]?(intake|strength|seats)|intake[-_ ]?capacity|\bintake\b|\bseats?\b)'
          anchor:
            - '(?i)(seat matrix|sanctioned intake|intake capacity|number of seats|seat availability|total seats|\bintake\b)'
          hint:
            - '(?i)(seat[-_ ]?matrix|sanctioned[-_ ]?(intake|strength)|intake[-_ ]?capacity|number of seats|seat availability)'
          negative:
            - '(?i)(fee for recognition|recognition of institution|research cent(re|er)|affiliation fee|inspection fee|re-?valuation fee)'
        fee_structure:
          family: fee_structure
          filename:
            - '(?i)(fee[-_ ]?structure|fee[-_ ]?schedule|fee[-_ ]?details|tuition[-_ ]?fee|hostel[-_ ]?fee|mess[-_ ]?fee|\bfees?\b)'
          anchor:
            - '(?i)(fee structure|fee details|fee schedule|tuition fee|hostel fee|mess fee|fee notification)'
          hint:
            - '(?i)(fee[-_ ]?structure|fee[-_ ]?schedule|tuition[-_ ]?fee|hostel[-_ ]?fee|mess[-_ ]?fee)'
          negative:
            - '(?i)(fee for recognition|recognition of institution|research cent(re|er)|affiliation fee|inspection fee|re-?valuation fee)'
        prospectus:
          filename:
            - '(?i)(prospectus|admission[-_ ]?brochure)'
          anchor:
            - '(?i)(prospectus|admission brochure)'
        placement:
          filename:
            - '(?i)(placement|annual[-_ ]?report|aqar|ssr|self[-_ ]?study|iqac)'
          anchor:
            - '(?i)(placement|annual report|aqar|ssr|self study|iqac)'
        nirf:
          filename:
            - '(?i)(nirf|dcs)'
          anchor:
            - '(?i)(nirf|dcs)'
      evidence_type_weights:
        seat_matrix: 40
        fee_structure: 40
        prospectus: 25
        placement: 15
        nirf: 12
      # PDF-first budget reserve (W1 2026-11-18): this share of
      # max_documents_per_domain may only be filled by evidence-typed documents
      # (a non-vetoed evidence_types match). News, tender, gallery and untitled
      # documents can only fill the remainder, so navigation-grade documents
      # cannot consume the evidence budget of a domain.
      pdf_first_reserve_percent: 50
      # Evidence targeting: how many inventory-discovered domains one run may
      # crawl, and how they are ranked. `naac_bonus` only applies when an
      # accreditation claim already names the domain.
      targeting:
        max_domains_per_run: 50
        base: 0
        known_website_bonus: 15
        naac_bonus: 25
        type_weights:
          central: 40
          deemed: 30
          state: 20
          private: 5
      # Dedupe policy: text fingerprint, computed over *extracted document
      # text*. `simhash` here fingerprints a bounded text sample (first
      # `text_max_pages` pages, `text_max_chars` characters) taken through the
      # T0 pdftext path; it never hashes raw PDF container bytes. Exact sha256
      # still runs first and catches byte-identical mirrors; identical extracted
      # text under different bytes is caught by its own text hash. If extraction
      # fails (scan, encrypted/broken PDF) the fetch degrades to exact-only and
      # the document is stored (audit 2026-11-18; migration 0007 records basis).
      dedupe:
        mode: simhash
        simhash_threshold: 3
        text_max_pages: 3
        text_max_chars: 20000
      # Programme materialisation (migration 0006). Predicate names, the
      # credential rules, recognition vocabulary and the name-alias table are
      # data: the stage in fmd/orchestrate/ingest.py contains no programme
      # vocabulary. Aliases collapse only provable synonyms; MLT and MLS stay
      # separate canonical programmes and are flagged `needs_review` when both
      # appear at one institution.
      programme_mapping:
        name_predicates:
          - curriculum.programme_name
          - seats.programme_name
          - accreditation.programme_name
        duration_month_predicates:
          - curriculum.duration_months
        internship_month_predicates:
          - curriculum.internship_months
        seats_predicates:
          - seats.total
        medium_predicates:
          - curriculum.medium
          - programme.medium
        affiliated_university_predicates:
          - curriculum.affiliated_university
          - accreditation.affiliated_university
        recognition_predicates:
          - accreditation.recognition_status
          - recognition.status
        credential_default: degree
        credential_rules:
          - level: certificate
            terms: [certificate]
          - level: diploma
            terms: [diploma, dmlt]
          - level: lateral_entry
            terms: [lateral entry, lateral]
          - level: degree
            terms: [bachelor, "b sc", bsc, "b mls", bmls, "b mlt", bmlt, degree]
        recognition_values:
          recognised: [recognised, recognized]
          conditional: [conditional, provisional]
          unrecognised: [unrecognised, unrecognized, not recognised, not recognized,
                         not approved]
        name_aliases:
          - key: bsc mlt
            label: B.Sc. Medical Laboratory Technology
            aliases:
              - B.Sc. MLT
              - BSc MLT
              - B.Sc. Medical Laboratory Technology
              - BSc Medical Laboratory Technology
              - Bachelor of Medical Laboratory Technology
              - Bachelor of Medical Laboratory Technology (BMLT)
              - BMLT
          - key: bsc mls
            label: Bachelor of Medical Laboratory Sciences
            aliases:
              - Bachelor of Medical Laboratory Sciences
              - Bachelor of Medical Laboratory Sciences (B.MLS)
              - Bachelor of Medical Laboratory Sciences(B.MLS)
              - B.Sc. Medical Laboratory Science
              - BSc Medical Laboratory Science
              - B.MLS
              - BMLS
          - key: dmlt
            label: Diploma in Medical Laboratory Technology
            aliases:
              - DMLT
              - Diploma in Medical Laboratory Technology
              - Diploma in Medical Laboratory Technician
    notes: Placement PDFs usually live in NAAC SSR/AQAR/NIRF DCS annexures. Self-reported, promotional; treat as low trust.

# Confirmed impersonators (spec §4.2.2). A trust registered under the Indian
# Trusts Act is NOT a statutory State Allied and Healthcare Council under the
# NCAHP Act 2021. The loader rejects any registry URL on these hosts and
# `validate_recognition_origin` rejects claims originating here. Statutory
# authenticity may only come from the NCAHP list.
denylisted_domains:
  - domain: statealliedandhealthcarecouncil.com
    reason: >-
      Private trust ("State Allied And Healthcare Council Lucknow / of India")
      claiming a registration number and Government of India recognition; not an
      NCAHP-constituted statutory council. Never fetch, never cite.
  - domain: sahstc.com
    reason: >-
      Private trust ("State Allied And Healthcare Skill And Training Council",
      Section-64(A) Indian Trust Act 1882); not an NCAHP statutory council.
      Never fetch, never cite.

# Explicitly excluded, with reasons (append-only log).
exclusions:
  - id: nabl_labs
    name: NABL accredited laboratories
    reason: >-
      robots.txt is `Disallow: /` (spec §4.4.1). Invariant 9 is absolute: do not
      crawl. clinical_training falls back to NABH only; a human may request an
      official data dump.
  - id: nirf_dcs
    name: NIRF Data Collection System (bulk)
    reason: Login-walled. Only public mirrors on college sites may be fetched.
  - id: job_portals
    name: Naukri / Indeed / Glassdoor bulk
    reason: ToS-restricted scraping. Aggregate figures only via public pages, low trust, never bulk.
  - id: captcha_gated_portals
    name: Any portal requiring CAPTCHA solving
    reason: Policy violation. Mark the record `unknown`, never bypass.
