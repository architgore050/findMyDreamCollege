# TEMPLATE — copy this file to `programmes/<id>.yaml` and fill it in.
#
# This file is documentation. The loader ignores files whose name starts with
# "_", so the placeholders below never enter the metrics.
#
# Every entry:
#   id, institution, programme, state, source_url, retrieved_at
#   expected.<field>: {value, unit, quote, status, expectation}
#
# A verified row needs EITHER `fixture:` on the entry (repo-relative path to a
# committed fixture containing the quote verbatim) OR `source_url` + a real
# `retrieved_at`. Otherwise it must be `status: unverified` with `value: null`.
#
# Table-row claims may also set:
#   context: "Institution / heading cell"
#   disambiguation: unique | context_row | context_window
#   row: {row_label, column_header, value_cell, table_page}
# The loader re-checks a verified context against the fixture. See
# docs/product-development-cycle/08-eval-methodology.md.

